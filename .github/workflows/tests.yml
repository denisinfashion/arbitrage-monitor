name: Проверки

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Математика
        run: python -m history.tests.test_math
      - name: Сквозной прогон конвейера
        run: python -m history.tests.test_pipeline
      - name: Снимок туда-обратно
        run: python -m history.tests.test_snapshot
      - name: Устойчивость к отказам бирж
        run: python -m history.tests.test_cex_resilience
      - name: Оповещения
        run: python -m history.tests.test_alerts
      - name: Отсев недостоверных данных
        run: python -m history.tests.test_quality
      - name: Отбор пулов DEX
        run: python -m history.tests.test_dex_discovery
      - name: Разбор связки по шагам
        run: python -m history.tests.test_breakdown
      - name: Инвентарь токенов
        run: python -m history.tests.test_inventory
      - name: Охват — активы и площадки
        run: python -m history.tests.test_scale
      - name: Свежие цены и глубина пулов
        run: python -m history.tests.test_live
