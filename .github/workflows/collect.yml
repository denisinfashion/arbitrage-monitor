name: Сбор котировок

# Каждые 15 минут. GitHub задерживает и пропускает запуски под нагрузкой —
# на бесплатном тарифе фактический интервал доходил до часа. Поэтому прогон
# теперь не короткий: внутри него живые цены пулов снимаются раз в пять
# минут всё время работы. Даже если следующий запуск задержится, плотность
# данных по DEX сохраняется.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:        # кнопка ручного запуска на вкладке Actions

# Один прогон за раз: два параллельных перезапишут снимок друг друга.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write           # нужно для публикации снимка в Release

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: pip install -r requirements.txt

      - name: Скачать накопленный снимок
        continue-on-error: true    # первого запуска ещё нет — это не ошибка
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          gh release download data --pattern '*.parquet' --dir data --clobber \
            && echo "снимок скачан" || echo "снимка ещё нет, начинаем с нуля"
          ls -la data/ || true

      - name: Цикл сбора
        env:
          # Раннеры GitHub в США: Binance и Bybit отдают 451, поэтому их
          # здесь нет. Остальные проверены и отвечают. Недоступная биржа
          # прогон не ломает — её discover ограничен по времени, и она
          # молча пропускается с записью в лог.
          # bitmart убран: ccxt такой биржи не знает, каждый прогон
          # начинался с предупреждения о ней.
          ARB_CEX_VENUES: "okx,gate,mexc,kucoin,bitget,htx,coinex,kraken,bitfinex"
          # Пар на биржу. Умножается на число бирж и на глубину истории,
          # поэтому это главный рычаг размера снимка: 10 бирж × 200 пар ×
          # 7 дней пятиминуток ≈ 4 млн строк ≈ 30 МБ. Скачивание и выгрузка
          # снимка отнимают у прогона около двух минут из тринадцати.
          ARB_CEX_SYMBOL_LIMIT: "200"
          # Площадки DEX, у которых берётся топ пулов отдельно от общего
          # топа сети. Без этого весь список забирает PancakeSwap: в BNB
          # Chain почти весь оборот у него, и межплощадочных связок
          # не возникает в принципе.
          #
          # Пусто — определять автоматически, спросив список у источника.
          # Записанный вручную список не совпадал с реальными
          # идентификаторами (`pancakeswap_v3` против `pancakeswap-v3-bsc`),
          # и все запросы уходили в никуда, причём молча.
          ARB_DEX_VENUES: ""
          # Список наблюдения живёт в файле watchlist.txt в корне проекта —
          # править его безопаснее, чем YAML. Эта переменная складывается
          # с содержимым файла, а не заменяет его: сюда удобно добавить
          # тикер разово, не трогая репозиторий.
          ARB_WATCH_TOKENS: ""
          # Необязательно. Без ключа лимит GeckoTerminal считается по IP,
          # а раннеры делят адреса между тысячами проектов — исторические
          # свечи DEX при этом почти всегда недоступны, остаются живые срезы.
          # Со своим ключом квота считается по нему.
          # Заводится в Settings -> Secrets and variables -> Actions.
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          COINGECKO_PLAN: demo
          # Оповещения. Необязательно: без этих двух секретов шаг молчит.
          # Заводятся там же, в Settings -> Secrets and variables -> Actions.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_MIN_MARGIN: "0.3"        # порог чистой маржи, %
          # Потолок правдоподобия. Маржа выше — это не находка, а неверная
          # цена: одноимённая подделка токена, налог на перевод, пул без
          # сделок. Без потолка такие связки вытесняют настоящие.
          ALERT_MAX_MARGIN: "5"          # выше — считаем артефактом, %
          ALERT_MIN_LIQUIDITY: "200000"  # минимальный пул в цепочке, $
          ALERT_MAX_PER_RUN: "5"         # сколько связок за прогон
          ALERT_MUTE_MINUTES: "90"       # сколько молчать о повторе
        run: |
          # Шаг сбора 5 минут, а не 1: пулы DEX всё равно снимаются раз
          # в пять минут, и минутные свечи бирж не с чем сопоставлять —
          # зато их в пять раз больше по объёму. Освободившееся место
          # уходит на биржи и пары, которых стало вдвое больше.
          # Десять минут, а не тринадцать. Прогон на тринадцати занимал
          # вместе с установкой зависимостей и выгрузкой снимка около
          # четырнадцати с половиной минут при расписании раз в пятнадцать:
          # группа concurrency почти не освобождалась, и любой запуск —
          # хоть по расписанию, хоть кнопкой — вставал в очередь за
          # предыдущим. Десять оставляют три минуты запаса, а срезов
          # по-прежнему три: на старте, через пять и через десять минут.
          python cloud_collect.py --minutes 10 --dex-every 300 \
                                  --days 7 --timeframe 5m --pools 200

      - name: Опубликовать снимок
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data >/dev/null 2>&1 \
            || gh release create data --title "Накопленные котировки" \
                 --notes "Снимок обновляется автоматически каждые 15 минут." --latest=false
          gh release upload data data/history.parquet data/pools.parquet --clobber
          echo "Снимок опубликован" >> $GITHUB_STEP_SUMMARY

      - name: Разбудить приложение
        continue-on-error: true
        run: |
          # Бесплатный тариф Streamlit усыпляет приложение после 12 часов
          # без посетителей. Сборщик и так просыпается каждые 15 минут —
          # пусть заодно заходит на страницу, тогда простоя не набирается.
          # Служебный адрес проверки здоровья вместо главной страницы:
          # сама страница отвечает цепочкой перенаправлений, в которой
          # curl упирался в потолок в пятьдесят переходов и возвращал
          # ошибку, хотя приложение при этом просыпалось.
          BASE="https://arbitrage-monitor.streamlit.app"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -m 60 \
                   --max-redirs 3 -L "$BASE/_stcore/health" || echo 000)
          echo "$BASE/_stcore/health -> $code"
          case "$code" in
            2*|3*) echo "приложение отвечает" ;;
            *)     echo "не ответило ($code), но на сбор это не влияет" ;;
          esac
