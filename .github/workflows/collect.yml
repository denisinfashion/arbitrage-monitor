name: Сбор котировок

# Каждые 15 минут. GitHub может задержать или пропустить запуск под нагрузкой —
# это нормально, следующий прогон доберёт пропущенное.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:        # кнопка ручного запуска на вкладке Actions

# Один прогон за раз: два параллельных перезапишут снимок друг друга.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write           # нужно для публикации снимка в Release

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: pip install -r requirements.txt

      - name: Скачать накопленный снимок
        continue-on-error: true    # первого запуска ещё нет — это не ошибка
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          gh release download data --pattern '*.parquet' --dir data --clobber \
            && echo "снимок скачан" || echo "снимка ещё нет, начинаем с нуля"
          ls -la data/ || true

      - name: Цикл сбора
        env:
          # Раннеры GitHub в США: Binance и Bybit отдают 451.
          # Список бирж переопределяется здесь без правки кода.
          ARB_CEX_VENUES: "okx,gate,mexc,kucoin"
          # Необязательно. Без ключа лимит GeckoTerminal считается по IP,
          # а раннеры делят адреса между тысячами проектов — исторические
          # свечи DEX при этом почти всегда недоступны, остаются живые срезы.
          # Со своим ключом квота считается по нему.
          # Заводится в Settings -> Secrets and variables -> Actions.
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          COINGECKO_PLAN: demo
          # Оповещения. Необязательно: без этих двух секретов шаг молчит.
          # Заводятся там же, в Settings -> Secrets and variables -> Actions.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_MIN_MARGIN: "0.3"        # порог чистой маржи, %
          ALERT_MIN_LIQUIDITY: "200000"  # минимальный пул в цепочке, $
          ALERT_MAX_PER_RUN: "5"         # сколько связок за прогон
          ALERT_MUTE_MINUTES: "90"       # сколько молчать о повторе
        run: |
          python cloud_collect.py --minutes 8 --days 7 --timeframe 1m --pools 100

      - name: Опубликовать снимок
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data >/dev/null 2>&1 \
            || gh release create data --title "Накопленные котировки" \
                 --notes "Снимок обновляется автоматически каждые 15 минут." --latest=false
          gh release upload data data/history.parquet data/pools.parquet --clobber
          echo "Снимок опубликован" >> $GITHUB_STEP_SUMMARY

      - name: Разбудить приложение
        continue-on-error: true
        run: |
          # Бесплатный тариф Streamlit усыпляет приложение после 12 часов
          # без посетителей. Сборщик и так просыпается каждые 15 минут —
          # пусть заодно заходит на страницу, тогда простоя не набирается.
          URL="https://arbitrage-monitor.streamlit.app/"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -m 60 -L "$URL" || echo 000)
          echo "$URL -> $code"
          [ "$code" = "200" ] && echo "приложение отвечает" \
            || echo "не ответило, но на сбор это не влияет"
