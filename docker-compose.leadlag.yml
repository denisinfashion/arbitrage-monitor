# Поиск зависимостей фьючерс ↔ DEX на общем сервере (рядом с TrueStats).
# Выкладка — только скриптом:  ssh arbitrage sh /opt/arbitrage/deploy/deploy.sh
# (arbitrage — ssh-имя того же сервера, что unitrika-test; у сканера всё своё:
#  /opt/arbitrage, compose-проект arbitrage, журнал /var/log/arbitrage-deploy.log)
#
# Интерфейс слушает только 127.0.0.1 — наружу не публикуется. Вход через туннель:
#   ssh -L 8501:127.0.0.1:8501 arbitrage   →   http://127.0.0.1:8501
#
# Лимиты памяти и CPU жёсткие: на сервере работает прод TrueStats.
# История котировок по-прежнему собирается в GitHub Actions (снимок в Release),
# поэтому сборщика history.collector здесь нет.

services:
  app:
    build: .
    image: arbitrage-scanner:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - arb-data:/data
    environment:
      TZ: Europe/Moscow
    env_file:
      - path: .env
        required: false
    mem_limit: 768m
    cpus: 1.0

  screener:
    image: arbitrage-scanner:latest   # образ собирается один раз — в сервисе app
    pull_policy: never
    restart: unless-stopped
    command: python -m leadlag.universe --every-hours 6
    volumes:
      - arb-data:/data
    environment:
      TZ: Europe/Moscow
    env_file:
      - path: .env
        required: false
    # ccxt держит в памяти справочник рынков каждой биржи — на 20 бирж это ~0,5–0,8 ГБ
    mem_limit: 1g
    cpus: 0.5
    healthcheck:
      disable: true   # проверка из образа — для интерфейса, у сборщика порта нет

  # Сделки по кандидатам (WebSocket бирж, блокчейн BSC/Base/Arbitrum, GeckoTerminal)
  # и поиск лага раз в 30 минут — одним процессом.
  ticks:
    image: arbitrage-scanner:latest   # образ собирается один раз — в сервисе app
    pull_policy: never
    restart: unless-stopped
    command: python -m leadlag.ticks
    volumes:
      - arb-data:/data
    environment:
      TZ: Europe/Moscow
    env_file:
      - path: .env
        required: false
    mem_limit: 768m   # ~430 МБ в работе: ccxt.pro по 8 биржам
    cpus: 0.75
    healthcheck:
      disable: true

  # Спреды бессрочных фьючерсов между 8 биржами с funding: снимок раз в минуту.
  spreads:
    image: arbitrage-scanner:latest   # образ собирается один раз — в сервисе app
    pull_policy: never
    restart: unless-stopped
    command: python -m leadlag.spreads
    volumes:
      - arb-data:/data
    environment:
      TZ: Europe/Moscow
    env_file:
      - path: .env      # TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
        required: false
    mem_limit: 640m
    cpus: 0.5
    healthcheck:
      disable: true

  # Бумажная торговля на лаге: стаканы ведущих и ведомых фьючерсов, без денег.
  paper:
    image: arbitrage-scanner:latest
    pull_policy: never
    restart: unless-stopped
    command: python -m leadlag.paper
    volumes:
      - arb-data:/data
    environment:
      TZ: Europe/Moscow
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      disable: true

volumes:
  arb-data:
